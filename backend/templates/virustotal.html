<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VirusTotal · PhishGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/dashboard.css?v=9" />
  <link rel="stylesheet" href="/static/lookup.css?v=9" />
</head>
<body>

<div class="app">

  <!-- ============ Sidebar ============ -->
  <div class="sidebar-wrap">
    <aside class="sidebar">
      <div class="brand-logo">🛡️</div>

      <nav class="nav">
        <a href="/dashboard" class="nav-item" data-tip="Dashboard"><span class="icon">◆</span></a>
        <a href="/dashboard" class="nav-item" data-tip="Analyze"><span class="icon">⬆</span></a>
        <a href="/dashboard" class="nav-item" data-tip="All Scans"><span class="icon">◈</span></a>
        <a href="/dashboard" class="nav-item" data-tip="Safe"><span class="icon">✔</span></a>
        <a href="/dashboard" class="nav-item" data-tip="Suspicious"><span class="icon">⚠</span></a>
        <a href="/dashboard" class="nav-item" data-tip="Phishing"><span class="icon">⛔</span></a>
        <a href="/virustotal" class="nav-item active" data-tip="VirusTotal"><span class="icon">◉</span></a>
        <a href="/abuseipdb" class="nav-item" data-tip="AbuseIPDB"><span class="icon">◎</span></a>
      </nav>
    </aside>
  </div>

  <!-- ============ Main ============ -->
  <main class="main">
    <header class="topbar">
      <div>
        <h1>VirusTotal Lookup</h1>
        <p class="topbar-sub">Check any IP, URL, domain or hash against 70+ engines.</p>
      </div>
      <div class="topbar-right">
        <span id="vtStatus" class="status-chip">checking…</span>
        <a href="/dashboard" class="btn btn-ghost">← Back</a>
      </div>
    </header>

    <section class="panel">
      <div class="panel-head">
        <h3>Query</h3>
        <span class="panel-tag">Cached 24 h</span>
      </div>

      <div class="lookup-bar">
        <select id="vtType">
          <option value="ip">IP Address</option>
          <option value="url">URL</option>
          <option value="domain">Domain</option>
          <option value="hash">File Hash (SHA-256)</option>
        </select>
        <input type="text" id="vtQuery" placeholder="Enter IP, URL, domain or hash…" />
        <button class="btn btn-primary" id="vtLookupBtn">Look up</button>
        <button class="btn btn-ghost" id="vtClearBtn">Clear</button>
      </div>
    </section>

    <section id="vtLoading" class="panel hidden">
      <p>⏳ Querying VirusTotal…</p>
    </section>

    <section id="vtError" class="panel hidden">
      <p id="vtErrorText"></p>
    </section>

    <section id="vtResult" class="hidden">
      <div class="panel">
        <div class="panel-head">
          <h3 id="vtResultTitle">Result</h3>
          <span id="vtVerdict" class="badge">—</span>
        </div>
        <div id="vtSummary" class="kv-grid"></div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3>Engine Detections</h3></div>
        <div id="vtStats" class="stat-badges"></div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3>Details</h3></div>
        <div id="vtDetails" class="kv-grid"></div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3>Raw JSON</h3></div>
        <details>
          <summary style="cursor:pointer;color:var(--accent-hover);font-weight:500">Show / hide raw response</summary>
          <pre id="vtRaw" class="raw-pre"></pre>
        </details>
      </div>
    </section>
  </main>
</div>

<script src="/static/virustotal.js?v=9"></script>
</body>
</html>
