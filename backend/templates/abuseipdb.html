<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AbuseIPDB · PhishGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/dashboard.css?v=9" />
  <link rel="stylesheet" href="/static/lookup.css?v=9" />
</head>
<body>

<div class="app">

  <!-- ============ Sidebar ============ -->
  <div class="sidebar-wrap">
    <aside class="sidebar">
      <div class="brand-logo">🛡️</div>

      <nav class="nav">
        <a href="/dashboard" class="nav-item" data-tip="Dashboard"><span class="icon">◆</span></a>
        <a href="/dashboard" class="nav-item" data-tip="Analyze"><span class="icon">⬆</span></a>
        <a href="/dashboard" class="nav-item" data-tip="All Scans"><span class="icon">◈</span></a>
        <a href="/dashboard" class="nav-item" data-tip="Safe"><span class="icon">✔</span></a>
        <a href="/dashboard" class="nav-item" data-tip="Suspicious"><span class="icon">⚠</span></a>
        <a href="/dashboard" class="nav-item" data-tip="Phishing"><span class="icon">⛔</span></a>
        <a href="/virustotal" class="nav-item" data-tip="VirusTotal"><span class="icon">◉</span></a>
        <a href="/abuseipdb" class="nav-item active" data-tip="AbuseIPDB"><span class="icon">◎</span></a>
      </nav>
    </aside>
  </div>

  <!-- ============ Main ============ -->
  <main class="main">
    <header class="topbar">
      <div>
        <h1>AbuseIPDB Lookup</h1>
        <p class="topbar-sub">Check the abuse reputation of any public IPv4 or IPv6 address.</p>
      </div>
      <div class="topbar-right">
        <span id="abuseStatus" class="status-chip">checking…</span>
        <a href="/dashboard" class="btn btn-ghost">← Back</a>
      </div>
    </header>

    <section class="panel">
      <div class="panel-head">
        <h3>Query</h3>
        <div class="filters">
          <select id="abuseDays">
            <option value="30">Last 30 days</option>
            <option value="90" selected>Last 90 days</option>
            <option value="180">Last 180 days</option>
            <option value="365">Last 365 days</option>
          </select>
        </div>
      </div>
      <div class="lookup-bar">
        <input type="text" id="abuseQuery" placeholder="Enter IP address (e.g. 23.21.109.197)" />
        <button class="btn btn-primary" id="abuseLookupBtn">Check IP</button>
        <button class="btn btn-ghost" id="abuseClearBtn">Clear</button>
      </div>
      <div class="muted" style="margin-top:8px">
        Only works with public IPs. Results cached for 24 h.
      </div>
    </section>

    <section id="abuseLoading" class="panel hidden">
      <p>⏳ Querying AbuseIPDB…</p>
    </section>

    <section id="abuseError" class="panel hidden">
      <p id="abuseErrorText"></p>
    </section>

    <section id="abuseResult" class="hidden">
      <div class="panel">
        <div class="panel-head">
          <h3 id="abuseTitle">Result</h3>
          <span id="abuseVerdict" class="badge">—</span>
        </div>
        <div id="abuseSummary" class="kv-grid"></div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3>Abuse Confidence</h3></div>
        <div id="abuseConfidenceBar" class="confidence-wrap">
          <div class="confidence-track">
            <div class="confidence-fill" id="abuseConfidenceFill"></div>
          </div>
          <span id="abuseConfidenceValue" class="confidence-value">0%</span>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3>Recent Reports</h3></div>
        <div id="abuseReports"></div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3>Raw JSON</h3></div>
        <details>
          <summary style="cursor:pointer;color:var(--accent-hover);font-weight:500">Show / hide raw response</summary>
          <pre id="abuseRaw" class="raw-pre"></pre>
        </details>
      </div>
    </section>
  </main>
</div>

<script src="/static/abuseipdb.js?v=9"></script>
</body>
</html>
