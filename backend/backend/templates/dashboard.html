<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard · Phishing Email Analyzer</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>🛡️ Phishing Email Analyzer</h1>
    <nav>
      <a href="/">Analyze</a>
      <a href="/dashboard" class="active">Dashboard</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <h2>Overview</h2>
      <div class="stats-grid" id="statsGrid">
        <div class="stat-box">
          <span class="stat-value" id="statTotal">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat-box safe">
          <span class="stat-value" id="statSafe">0</span>
          <span class="stat-label">Safe</span>
        </div>
        <div class="stat-box suspicious">
          <span class="stat-value" id="statSuspicious">0</span>
          <span class="stat-label">Suspicious</span>
        </div>
        <div class="stat-box phishing">
          <span class="stat-value" id="statPhishing">0</span>
          <span class="stat-label">Phishing</span>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="table-header">
        <h2>Analysis History</h2>
        <div class="filters">
          <input type="text" id="searchInput" placeholder="Search sender / subject..." />
          <select id="verdictFilter">
            <option value="">All verdicts</option>
            <option value="Safe">Safe</option>
            <option value="Suspicious">Suspicious</option>
            <option value="Phishing">Phishing</option>
          </select>
          <button id="refreshBtn" class="secondary">🔄 Refresh</button>
        </div>
      </div>

      <div class="table-wrap">
        <table class="history-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Date</th>
              <th>Sender</th>
              <th>Subject</th>
              <th>Score</th>
              <th>Verdict</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="historyBody">
            <tr><td colspan="7" class="muted">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>© <span id="year"></span> Phishing Email Analyzer</p>
  </footer>

  <script src="/static/dashboard.js"></script>
</body>
</html>
